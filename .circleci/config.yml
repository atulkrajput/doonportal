version: 2.1

# Required project environment variables (CircleCI > Project Settings > Environment Variables):
#   DEPLOY_HOST  - server hostname or IP
#   DEPLOY_USER  - SSH user on the server
#   DEPLOY_PATH  - absolute path of the app on the server (e.g. /home/user/public_html)
#   DEPLOY_PORT  - SSH port (optional, defaults to 22)
# Also add the deploy SSH private key under Project Settings > SSH Keys and
# put its fingerprint in the add_ssh_keys step below.

executors:
  php:
    docker:
      - image: cimg/php:8.3-node
    working_directory: ~/app

jobs:
  build:
    executor: php
    steps:
      - checkout
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
            - composer-v1-
      - run:
          name: Install Composer dependencies
          command: composer install --no-interaction --prefer-dist --no-progress
      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install npm dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Build frontend assets
          command: npm run build
      - run:
          name: Prepare environment
          command: |
            cp .env.example .env
            php artisan key:generate
      - run:
          name: Run tests
          command: php artisan test
      - persist_to_workspace:
          root: ~/app
          paths:
            - public/build

  deploy:
    executor: php
    steps:
      - checkout
      - attach_workspace:
          at: ~/app
      - add_ssh_keys:
          fingerprints:
            - "SHA256:REPLACE_WITH_YOUR_DEPLOY_KEY_FINGERPRINT"
      - run:
          name: Add server to known hosts
          command: ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - run:
          name: Install rsync
          command: sudo apt-get update && sudo apt-get install -y rsync
      - run:
          name: Sync files to server
          command: |
            rsync -az --delete \
              -e "ssh -p ${DEPLOY_PORT:-22}" \
              --exclude='.git' \
              --exclude='.circleci' \
              --exclude='.github' \
              --exclude='.env' \
              --exclude='node_modules' \
              --exclude='vendor' \
              --exclude='tests' \
              --exclude='storage/app/*' \
              --exclude='storage/framework/cache/*' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='storage/logs/*' \
              --exclude='public/storage' \
              ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
      - run:
          name: Run post-deploy commands
          command: |
            ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" bash -se <<EOSSH
            set -e
            cd "$DEPLOY_PATH"
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            [ -L public/storage ] || php artisan storage:link
            php artisan optimize:clear
            php artisan optimize
            EOSSH

workflows:
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master
