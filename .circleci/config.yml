version: 2.1

# Deploys over FTP with lftp's mirror (rsync-style: uploads only changed files and
# deletes files removed from the repo). FTP can't run commands on the server, so
# production vendor/ and public/build are built here and uploaded.
#
# Required project environment variables (CircleCI > Project Settings > Environment Variables):
#   FTP_HOST      - FTP server hostname
#   FTP_USER      - FTP username
#   FTP_PASSWORD  - FTP password
#   FTP_PATH      - remote app directory, relative to the FTP login root (e.g. public_html)
#   FTP_PORT      - FTP port (optional, defaults to 21)
#   FTP_CERT_FINGERPRINT - SHA-1 fingerprint of the host's FTPS certificate (optional,
#                   defaults to the one pinned below). The host's certificate is issued
#                   for its own server name, not FTP_HOST, so this one certificate is
#                   trusted despite the name mismatch and any other is rejected. When the
#                   host renews it, the deploy fails with "certificate common name doesn't
#                   match" and the new fingerprint: put that in this variable.
#   FTP_VERIFY_CERT - leave unset. "no" turns off certificate checks entirely.
#
# The connection must use TLS (ftp:ssl-force); it never falls back to plain FTP.
#
# Never uploaded or deleted on the server: .env, storage/app, storage/logs,
# storage/framework/{cache,sessions,views} and public/storage (the deploy only creates
# those storage folders when they are missing). Create the server's
# .env by hand once. Migrations can't run over FTP: run `php artisan migrate --force`
# from the host's terminal (e.g. cPanel) when a deploy adds one.

executors:
  php:
    docker:
      - image: cimg/php:8.3-node
    working_directory: ~/app

jobs:
  build:
    executor: php
    steps:
      - checkout
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
            - composer-v1-
      - run:
          name: Install Composer dependencies
          command: composer install --no-interaction --prefer-dist --no-progress
      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install npm dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Build frontend assets
          command: npm run build
      - run:
          name: Prepare environment
          command: |
            cp .env.example .env
            php artisan key:generate
      - run:
          name: Run tests
          command: php artisan test
      - persist_to_workspace:
          root: ~/app
          paths:
            - public/build

  deploy:
    executor: php
    steps:
      - checkout
      - attach_workspace:
          at: ~/app
      - restore_cache:
          keys:
            - composer-nodev-v1-{{ checksum "composer.lock" }}
            - composer-nodev-v1-
      - run:
          name: Install production Composer dependencies
          command: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - save_cache:
          key: composer-nodev-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor
      - run:
          name: Install lftp
          command: sudo apt-get update && sudo apt-get install -y lftp
      - run:
          name: Sync files to server over FTP
          command: |
            lftp -u "$FTP_USER","$FTP_PASSWORD" -p "${FTP_PORT:-21}" "$FTP_HOST" \<<EOF
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate ${FTP_VERIFY_CERT:-yes}
            set ssl:verify-certificate/${FTP_CERT_FINGERPRINT:-69:92:4B:8A:19:A2:45:C8:80:EB:2E:50:2D:FD:4B:BE:5B:66:72:16} no
            set net:max-retries 3
            set net:timeout 30
            mkdir -p -f "$FTP_PATH/storage/app/public" "$FTP_PATH/storage/app/private" "$FTP_PATH/storage/framework/cache/data" "$FTP_PATH/storage/framework/sessions" "$FTP_PATH/storage/framework/views" "$FTP_PATH/storage/logs"
            mirror --reverse --delete --verbose --parallel=4 \
              -x '^\.git/' \
              -x '^\.github/' \
              -x '^\.circleci/' \
              -x '^\.claude/' \
              -x '^\.env' \
              -x '^node_modules/' \
              -x '^tests/' \
              -x '^storage/app/' \
              -x '^storage/logs/' \
              -x '^storage/framework/(cache|sessions|views)/' \
              -x '^public/storage' \
              -x '^phpunit\.xml$' \
              ./ "$FTP_PATH"
            bye
            EOF

workflows:
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master
